<!DOCTYPE html>
<html lang="fa" dir="rtl">
 

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> سامانه مدیریت خوابگاه</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <main class="login-page">
        
<!--اطلاعات سایت و لوگو-->
        <section class="login-info">

            <div class="login-logo">
                🏠
            </div>

            <h1>
                خوابگاه دانشجویی
            </h1>

            <p>
                سامانه مدیریت و خدمات خوابگاه دانشجویی
            </p>

            <p>
                مدیریت آسان‌تر، زندگی دانشجویی بهتر
            </p>

        </section>
        <section class="login-card">

<!--کادر لاگین-->
            <div class="login-header">

                <h2>
                    ورود به حساب کاربری
                </h2>

                <p>
                    برای ورود اطلاعات خود را وارد کنید
                </p>

            </div>

            <form id="loginForm">

<!--شماره دانشجویی-->
                <div class="form-group">

                    <label for="studentId">
                        شماره دانشجویی
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="مثلاً 4011429064"
                    >

                </div>

<!--رمز عبور-->
                <div class="form-group">

                    <div class="password-label">

                        <label for="password">
                            رمز عبور
                        </label>

                        <a href="#">
                            فراموشی رمز عبور؟
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        placeholder="رمز عبور خود را وارد کنید"
                    >
        
                </div>

<!-- مرا به خاطر بسپار -->

                <div class="remember">

                    <label>

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        مرا به خاطر بسپار

                    </label>

                </div>

<!-- دکمه ورود -->

                <button
                    type="submit"
                    class="login-button"
                >
                    ورود به سامانه
                </button>

            </form>

<!-- ثبت نام -->

            <div class="register">

                <span>
                    حساب کاربری ندارید؟
                </span>

                <a href="#">
                    ثبت‌نام کنید
                </a>

            </div>

        </section>

    </main>


<!-- اتصال JS -->

    <script src="js/script.js"></script>


</body>


</html>
